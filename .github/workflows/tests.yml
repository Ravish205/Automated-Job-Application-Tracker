name: Tests and Quality Assurance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: job_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Lint Checks
        run: |
          ruff check .
          ruff format --check .

      - name: Run Pytest Suite with Coverage
        env:
          FLASK_CONFIG: testing
          DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/job_tracker_test
          SECRET_KEY: ci-test-secret-key-32-bytes-minimum-value
        run: |
          pytest --cov=app --cov-report=term-missing
