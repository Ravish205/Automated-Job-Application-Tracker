{% extends "base.html" %}

{% block title %}Applications{% endblock %}
{% block page_title %}Applications{% endblock %}

{% block content %}
<div class="empty-state">
  <i data-lucide="file-text" class="empty-state-icon"></i>
  <h2 class="empty-state-title">No applications yet</h2>
  <p class="empty-state-desc">Start tracking your job search by adding your first application.</p>
  <button type="button" class="btn btn-primary">
    <i data-lucide="plus"></i>
    <span>Add application</span>
  </button>
</div>
{% endblock %}
