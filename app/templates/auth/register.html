{% extends "base.html" %}

{% block title %}Create account{% endblock %}

{% block public_content %}
<div class="container" style="max-width: 440px; padding: 60px 16px;">
  <div class="card">
    <div style="text-align: center; margin-bottom: 24px;">
      <h1 style="font-size: 22px; margin-bottom: 6px;">Create account</h1>
      <p class="text-sm">Start tracking and organizing your job search today.</p>
    </div>
    <form method="POST" action="{{ url_for('auth.register') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label" for="full_name">Full name</label>
        <input type="text" id="full_name" name="full_name" class="form-control" required autocomplete="name" autofocus>
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input type="email" id="email" name="email" class="form-control" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" required autocomplete="new-password">
      </div>
      <div class="form-group">
        <label class="form-label" for="confirm_password">Confirm password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Create account</button>
    </form>
    <div style="text-align: center; margin-top: 18px; font-size: 13px;">
      <span class="text-muted">Already have an account?</span>
      <a href="{{ url_for('auth.login') }}">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}
