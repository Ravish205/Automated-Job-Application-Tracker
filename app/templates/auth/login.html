{% extends "base.html" %}

{% block title %}Sign in{% endblock %}

{% block public_content %}
<div class="container" style="max-width: 420px; padding: 60px 16px;">
  <div class="card">
    <div style="text-align: center; margin-bottom: 24px;">
      <h1 style="font-size: 22px; margin-bottom: 6px;">Sign in</h1>
      <p class="text-sm">Access your job applications and tracking dashboard.</p>
    </div>
    <form method="POST" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input type="email" id="email" name="email" class="form-control" required autocomplete="email" autofocus>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Sign in</button>
    </form>
    <div style="text-align: center; margin-top: 18px; font-size: 13px;">
      <span class="text-muted">Don't have an account?</span>
      <a href="{{ url_for('auth.register') }}">Create account</a>
    </div>
  </div>
</div>
{% endblock %}
